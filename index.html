<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERHUNT // Cyber City Escape</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- Cinematic Intro -->
    <div id="intro-screen" class="overlay flex-center">
        <div class="intro-content">
            <h1 class="glitch-title" data-text="CYBERHUNT">CYBERHUNT</h1>
            <p class="subtitle">ESCAPE THE CYBER CITY // ELIMINATE THE THREAT</p>
            <div id="enter-btn" class="neon-btn">ENTER GAMING ARENA</div>
        </div>
    </div>

    <!-- Cyber City Dashboard -->
    <div id="dashboard" class="overlay hidden">
        <div class="dash-header">
            <h2>CYBER CITY MAP</h2>
            <div id="badge-container">
                <span class="badge locked" id="b1">BLDG 1</span>
                <span class="badge locked" id="b2">BLDG 2</span>
                <span class="badge locked" id="b3">BLDG 3</span>
                <span class="badge locked" id="b4">BLDG 4</span>
                <span class="badge locked" id="b5">BLDG 5</span>
            </div>
        </div>
        
        <div id="building-grid" class="grid-container"></div>
    </div>

    <!-- 3D Game UI Overlay -->
    <div id="game-ui" class="hidden">
        <div class="hud-header">
            <div id="current-mission">MISSION: ROOM 1.1 - PURGE THREATS</div>
            <div id="digit-tracker">PASSCODE CLUES: <span id="code-digits">_ _ _ _</span></div>
        </div>

        <!-- Clue Decryption Panel -->
        <div id="clue-panel" class="modal hidden">
            <h3 id="clue-title">SYSTEM INTERCEPTED</h3>
            <p id="clue-body">Decoding packet...</p>
            <div class="neon-btn small" onclick="closeClue()">CLOSE PANEL</div>
        </div>

        <!-- Exit Keypad Modal -->
        <div id="keypad-panel" class="modal hidden">
            <h3>TERMINAL ACCESS KEYPAD</h3>
            <input type="password" id="keypad-input" maxlength="4" placeholder="____" readonly>
            <div class="keypad-grid">
                <button onclick="pressKey('1')">1</button><button onclick="pressKey('2')">2</button><button onclick="pressKey('3')">3</button>
                <button onclick="pressKey('4')">4</button><button onclick="pressKey('5')">5</button><button onclick="pressKey('6')">6</button>
                <button onclick="pressKey('7')">7</button><button onclick="pressKey('8')">8</button><button onclick="pressKey('9')">9</button>
                <button onclick="clearKeypad()" class="danger">C</button>
                <button onclick="pressKey('0')">0</button>
                <button onclick="submitKeypad()" class="success">OK</button>
            </div>
            <div class="neon-btn small danger" onclick="closeKeypad()">ABORT</div>
        </div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="game-canvas"></canvas>

    <script src="arena.js"></script>
    <script src="script.js"></script>
</body>
</html>
